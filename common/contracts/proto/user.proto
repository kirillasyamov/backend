syntax = "proto3";

package user.v1;

import "google/protobuf/empty.proto";

service UserService {
	rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  	rpc GetUser (GetUserRequest) returns (GetUserResponse);
  	rpc GetUsers (GetUsersRequest) returns (GetUsersResponse);
  	rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
	rpc DeleteUser (DeleteUserRequest) returns (google.protobuf.Empty);

	rpc TransferBalance (TransferBalanceRequest) returns (TransferBalanceResponse);
	rpc ResetBalance (google.protobuf.Empty) returns (google.protobuf.Empty);
}

message UserProfileData {
	string login = 1;
	string email = 2;
	uint32 age = 3;
	string bio = 4;
	string balance = 5;
}

message CreateUserRequest {
	string login = 1;
	string email = 2;
	uint32 age = 3;
	string bio = 4;
}

message CreateUserResponse {
	UserProfileData userProfile = 1;
	string profileId = 2;
}

message GetUserRequest {
	oneof identifier {
  		string accountId = 1;
		string login = 2;
	}
}

message GetUserResponse {
	UserProfileData userProfile = 1;
}

message GetUsersRequest {
  	uint32 limit = 1;
  	uint32 page = 2;
}

message GetUsersResponse {
	repeated UserProfileData users = 1;
	uint32 total = 2;
	uint32 page = 3;
	uint32 limit = 4;
}

message UpdateUserRequest {
	string login = 1;
	optional uint32 age = 2;
	optional string bio = 3;
}

message UpdateUserResponse {
	UserProfileData userProfile = 1;
}

message DeleteUserRequest {
	oneof identifier {
		string id = 1;
		string login = 2;
	}
}

message TransferBalanceRequest {
	string idempotencyKey = 1;
	string senderLogin = 2;
	string recipientLogin = 3;
	string amount = 4;
}

message TransferBalanceResponse {
	string updatedBalance = 1;
}

