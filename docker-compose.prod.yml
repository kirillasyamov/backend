version: '3.9'

services:
    postgres:
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d postgres']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    auth-service:
        image: kirillasyamov/auth-service:latest
        container_name: auth-service
        restart: unless-stopped
        environment:
            NODE_ENV: production
            GRPC_HOST: 0.0.0.0
            GRPC_PORT: 50002
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            PASSWORD_PEPPER: ${PASSWORD_PEPPER}
            EXP_DAYS: 30
            TOKEN_SERVICE_URL: token-service:50004
        depends_on:
            postgres:
                condition: service_healthy
        expose:
            - '50002'
        networks:
            - backend

    user-service:
        image: kirillasyamov/user-service:latest
        container_name: user-service
        restart: unless-stopped
        environment:
            NODE_ENV: production
            GRPC_HOST: 0.0.0.0
            GRPC_PORT: 50051
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        depends_on:
            postgres:
                condition: service_healthy
        expose:
            - '50051'
        networks:
            - backend

    token-service:
        image: kirillasyamov/token-service:latest
        container_name: token-service
        restart: unless-stopped
        environment:
            NODE_ENV: production
            GRPC_HOST: 0.0.0.0
            GRPC_PORT: 50004
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
            JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
            JWT_ISSUER: token-service
        depends_on:
            redis:
                condition: service_healthy
        expose:
            - '50004'
        networks:
            - backend

    api-gateway:
        image: kirillasyamov/api-gateway:latest
        container_name: api-gateway
        restart: unless-stopped
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: 3001
            CORS_ORIGIN: ${CORS_ORIGIN}
            AUTH_SERVICE_URL: auth-service:50002
            USER_SERVICE_URL: user-service:50051
            TOKEN_SERVICE_URL: token-service:50004
        ports:
            - '3001:3001'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s
        depends_on:
            auth-service:
                condition: service_started
            user-service:
                condition: service_started
            token-service:
                condition: service_started
        networks:
            - backend

networks:
    backend: