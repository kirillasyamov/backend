apiVersion: apps/v1
kind: Deployment
metadata:
    name: ngrok
    namespace: backend
    labels:
        app: ngrok
spec:
    replicas: 1
    selector:
        matchLabels:
            app: ngrok
    template:
        metadata:
            labels:
                app: ngrok
        spec:
            containers:
                - name: ngrok
                  image: ngrok/ngrok:3
                  imagePullPolicy: Always
                  args:
                      - http
                      - --url=$(NGROK_DOMAIN)
                      - --log=stdout
                      - http://api-gateway.backend.svc.cluster.local:3001
                  env:
                      - name: NGROK_AUTHTOKEN
                        valueFrom:
                            secretKeyRef:
                                name: backend-secret
                                key: NGROK_AUTHTOKEN
                      - name: NGROK_DOMAIN
                        valueFrom:
                            secretKeyRef:
                                name: backend-secret
                                key: NGROK_DOMAIN
