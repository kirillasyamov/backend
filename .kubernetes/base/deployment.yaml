apiVersion: apps/v1
kind: Deployment
metadata:
    name: auth-service
    namespace: backend
    labels:
        app: auth-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: auth-service
    template:
        metadata:
            labels:
                app: auth-service
        spec:
            containers:
                - name: auth-service
                  image: kirillasyamov/auth-service:latest
                  imagePullPolicy: Always
                  ports:
                      - name: grpc
                        containerPort: 50002
                  envFrom:
                      - configMapRef:
                            name: backend-config
                      - secretRef:
                            name: backend-secret
                  env:
                      - name: NODE_ENV
                        value: production
                      - name: GRPC_PORT
                        value: '50002'
                      - name: DATABASE_URL
                        value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/auth
                  readinessProbe:
                      grpc:
                          port: 50002
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      grpc:
                          port: 50002
                      initialDelaySeconds: 15
                      periodSeconds: 20
---
