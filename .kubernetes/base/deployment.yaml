apiVersion: apps/v1
kind: Deployment
metadata:
    name: api-gateway
    namespace: backend
    labels:
        app: api-gateway
spec:
    replicas: 1
    selector:
        matchLabels:
            app: api-gateway
    template:
        metadata:
            labels:
                app: api-gateway
        spec:
            containers:
                - name: api-gateway
                  image: kirillasyamov/api-gateway:latest
                  imagePullPolicy: Always
                  ports:
                      - name: http
                        containerPort: 3001
                  envFrom:
                      - configMapRef:
                            name: backend-config
                  env:
                      - name: NODE_ENV
                        value: production
                  readinessProbe:
                      httpGet:
                          path: /healthz
                          port: 3001
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: 3001
                      initialDelaySeconds: 15
                      periodSeconds: 20
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
    namespace: backend
    labels:
        app: postgres
spec:
    serviceName: postgres
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:15.3
                  ports:
                      - containerPort: 5432
                  env:
                      - name: POSTGRES_USER
                        valueFrom:
                            secretKeyRef:
                                name: backend-secret
                                key: POSTGRES_USER
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: backend-secret
                                key: POSTGRES_PASSWORD
                  volumeMounts:
                      - name: postgres-data
                        mountPath: /var/lib/postgresql/data
    volumeClaimTemplates:
        - metadata:
              name: postgres-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: redis
    namespace: backend
    labels:
        app: redis
spec:
    serviceName: redis
    replicas: 1
    selector:
        matchLabels:
            app: redis
    template:
        metadata:
            labels:
                app: redis
        spec:
            containers:
                - name: redis
                  image: redis:7-alpine
                  args: ['--appendonly', 'yes']
                  ports:
                      - containerPort: 6379
                  volumeMounts:
                      - name: redis-data
                        mountPath: /data
    volumeClaimTemplates:
        - metadata:
              name: redis-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 512Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: minio
    namespace: backend
    labels:
        app: minio
spec:
    serviceName: minio
    replicas: 1
    selector:
        matchLabels:
            app: minio
    template:
        metadata:
            labels:
                app: minio
        spec:
            containers:
                - name: minio
                  image: minio/minio:latest
                  args: ['server', '/data', '--console-address', ':9001']
                  ports:
                      - containerPort: 9000
                      - containerPort: 9001
                  env:
                      - name: MINIO_ROOT_USER
                        valueFrom:
                            secretKeyRef:
                                name: backend-secret
                                key: MINIO_ROOT_USER
                      - name: MINIO_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: backend-secret
                                key: MINIO_ROOT_PASSWORD
                  volumeMounts:
                      - name: minio-data
                        mountPath: /data
    volumeClaimTemplates:
        - metadata:
              name: minio-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 1Gi