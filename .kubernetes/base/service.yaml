apiVersion: v1
kind: Service
metadata:
    name: auth-service
    namespace: backend
spec:
    clusterIP: None
    selector:
        app: auth-service
    ports:
        - name: grpc
          port: 50002
          targetPort: 50002
---
apiVersion: v1
kind: Service
metadata:
    name: user-service
    namespace: backend
spec:
    clusterIP: None
    selector:
        app: user-service
    ports:
        - name: grpc
          port: 50051
          targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
    name: token-service
    namespace: backend
spec:
    clusterIP: None
    selector:
        app: token-service
    ports:
        - name: grpc
          port: 50004
          targetPort: 50004
---
apiVersion: v1
kind: Service
metadata:
    name: media-service
    namespace: backend
spec:
    clusterIP: None
    selector:
        app: media-service
    ports:
        - name: grpc
          port: 50006
          targetPort: 50006
---
apiVersion: v1
kind: Service
metadata:
    name: api-gateway
    namespace: backend
spec:
    type: ClusterIP
    selector:
        app: api-gateway
    ports:
        - name: http
          port: 3001
          targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
    namespace: backend
spec:
    type: ClusterIP
    selector:
        app: postgres
    ports:
        - port: 5432
          targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
    name: redis
    namespace: backend
spec:
    type: ClusterIP
    selector:
        app: redis
    ports:
        - port: 6379
          targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
    name: minio
    namespace: backend
spec:
    type: ClusterIP
    selector:
        app: minio
    ports:
        - name: api
          port: 9000
          targetPort: 9000
        - name: console
          port: 9001
          targetPort: 9001